name: "Windows Build"

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build-qhenkix:
    name: QhenkiX
    runs-on: windows-latest
    strategy:
      matrix:
        config: [Debug, Release]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.29'

    - name: Set up MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Configure CMake
      run: cmake -B build -S . -G "Visual Studio 17 2022" -A x64

    - name: Build QhenkiX
      run: cmake --build build --config ${{ matrix.config }} --target QhenkiX --parallel

    - name: Upload QhenkiX Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: qhenkix-library-windows-${{ matrix.config }}
        path: build/QhenkiX/${{ matrix.config }}/QhenkiX.lib
        retention-days: 1

  build-sxc:
    name: SXC
    runs-on: windows-latest
    needs: build-qhenkix
    strategy:
      matrix:
        config: [Debug, Release]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.29'

    - name: Set up MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Download QhenkiX
      uses: actions/download-artifact@v4
      with:
        name: qhenkix-library-windows-${{ matrix.config }}
        path: prebuilt/

    - name: Configure CMake
      run: cmake -B build -S . -G "Visual Studio 17 2022" -A x64 -DQHENKIX_PREBUILT_LIB=${{ github.workspace }}/prebuilt/QhenkiX.lib

    - name: Build SXC
      run: cmake --build build --config ${{ matrix.config }} --target SXC --parallel

    - name: Upload SXC Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: sxc-windows-${{ matrix.config }}
        path: build/SXC/${{ matrix.config }}/
        retention-days: 1

  build-examples:
    name: ${{ matrix.example }} (${{ matrix.config }})
    runs-on: windows-latest
    needs: [build-qhenkix, build-sxc]
    strategy:
      matrix:
        example: [SimpleExample, ImGuiExample, gltfViewer]
        config: [Debug, Release]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.29'

    - name: Set up MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Download QhenkiX
      uses: actions/download-artifact@v4
      with:
        name: qhenkix-library-windows-${{ matrix.config }}
        path: prebuilt/

    - name: Download SXC
      uses: actions/download-artifact@v4
      with:
        name: sxc-windows-${{ matrix.config }}
        path: prebuilt-sxc/

    - name: Configure CMake
      run: cmake -B build -S . -G "Visual Studio 17 2022" -A x64 -DQHENKIX_PREBUILT_LIB=${{ github.workspace }}/prebuilt/QhenkiX.lib -DSXC_PREBUILT_EXE=${{ github.workspace }}/prebuilt-sxc/SXC.exe

    - name: Build ${{ matrix.example }} (${{ matrix.config }})
      run: cmake --build build --config ${{ matrix.config }} --target ${{ matrix.example }} --parallel

    - name: Upload ${{ matrix.example }} (${{ matrix.config }}) Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.example }}-build-windows-${{ matrix.config }}
        path: build/Examples/${{ matrix.example }}/${{ matrix.config }}/
        retention-days: 1

  windows-build-gate:
    name: Windows build
    runs-on: ubuntu-24.04
    needs:
      - build-qhenkix
      - build-sxc
      - build-examples
    if: ${{ always() }}
    steps:
      - name: Fail if any upstream job failed
        run: |
          for result in "${{ needs.build-qhenkix.result }}" "${{ needs.build-sxc.result }}" "${{ needs.build-examples.result }}"; do
            if [ "$result" != "success" ]; then
              echo "Upstream job failed: $result"
              exit 1
            fi
          done
          echo "All Windows build jobs succeeded."
