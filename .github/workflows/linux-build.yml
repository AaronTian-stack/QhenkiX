name: "Linux Build"

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build-qhenkix:
    name: QhenkiX
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        config: [Debug, Release]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        fetch-depth: 0

    - name: Install system dependencies
      run: |
        sudo apt-get update -y
        sudo apt-get install -y \
          clang \
          lld \
          build-essential \
          git \
          make \
          pkg-config \
          ninja-build \
          gnome-desktop-testing \
          libasound2-dev \
          libpulse-dev \
          libaudio-dev \
          libfribidi-dev \
          libjack-dev \
          libsndio-dev \
          libx11-dev \
          libxext-dev \
          libxrandr-dev \
          libxcursor-dev \
          libxfixes-dev \
          libxi-dev \
          libxss-dev \
          libxtst-dev \
          libxkbcommon-dev \
          libdrm-dev \
          libgbm-dev \
          libgl1-mesa-dev \
          libgles2-mesa-dev \
          libegl1-mesa-dev \
          libdbus-1-dev \
          libibus-1.0-dev \
          libudev-dev \
          libthai-dev \
          libpipewire-0.3-dev \
          libwayland-dev \
          libdecor-0-dev \
          liburing-dev

    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.29'

    - name: Configure CMake
      run: cmake --preset ${{ matrix.config == 'Debug' && 'linux-debug' || 'linux-release' }}

    - name: Build QhenkiX
      run: cmake --build build --target QhenkiX --parallel

    - name: Upload QhenkiX Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: qhenkix-prebuilt-linux-${{ matrix.config }}
        path: |
          build/QhenkiX/libQhenkiX.a
          build/SDL/libSDL3.so*
        retention-days: 1
        if-no-files-found: error

  build-sxc:
    name: SXC
    runs-on: ubuntu-24.04
    needs: build-qhenkix
    strategy:
      matrix:
        config: [Debug, Release]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        fetch-depth: 0

    - name: Install system dependencies
      run: |
        sudo apt-get update -y
        sudo apt-get install -y \
          clang \
          lld \
          build-essential \
          git \
          make \
          pkg-config \
          ninja-build \
          gnome-desktop-testing \
          libasound2-dev \
          libpulse-dev \
          libaudio-dev \
          libfribidi-dev \
          libjack-dev \
          libsndio-dev \
          libx11-dev \
          libxext-dev \
          libxrandr-dev \
          libxcursor-dev \
          libxfixes-dev \
          libxi-dev \
          libxss-dev \
          libxtst-dev \
          libxkbcommon-dev \
          libdrm-dev \
          libgbm-dev \
          libgl1-mesa-dev \
          libgles2-mesa-dev \
          libegl1-mesa-dev \
          libdbus-1-dev \
          libibus-1.0-dev \
          libudev-dev \
          libthai-dev \
          libpipewire-0.3-dev \
          libwayland-dev \
          libdecor-0-dev \
          liburing-dev

    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.29'

    - name: Download QhenkiX
      uses: actions/download-artifact@v4
      with:
        name: qhenkix-prebuilt-linux-${{ matrix.config }}
        path: prebuilt-qhenkix/

    - name: Configure CMake
      run: cmake --preset ${{ matrix.config == 'Debug' && 'linux-prebuilt-sxc-debug' || 'linux-prebuilt-sxc-release' }}

    - name: Build SXC
      run: cmake --build build --target SXC --parallel

    - name: Upload SXC Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: sxc-linux-${{ matrix.config }}
        path: |
          build/SXC/SXC
          build/SXC/*.so*
        retention-days: 1
        if-no-files-found: error

  build-examples:
    name: ${{ matrix.example }} (${{ matrix.config }})
    runs-on: ubuntu-24.04
    needs: [build-qhenkix, build-sxc]
    strategy:
      matrix:
        example: [SimpleExample, ImGuiExample, gltfViewer, RetroExample]
        config: [Debug, Release]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        fetch-depth: 0

    - name: Install system dependencies
      run: |
        sudo apt-get update -y
        sudo apt-get install -y \
          clang \
          lld \
          build-essential \
          git \
          make \
          pkg-config \
          ninja-build \
          gnome-desktop-testing \
          libasound2-dev \
          libpulse-dev \
          libaudio-dev \
          libfribidi-dev \
          libjack-dev \
          libsndio-dev \
          libx11-dev \
          libxext-dev \
          libxrandr-dev \
          libxcursor-dev \
          libxfixes-dev \
          libxi-dev \
          libxss-dev \
          libxtst-dev \
          libxkbcommon-dev \
          libdrm-dev \
          libgbm-dev \
          libgl1-mesa-dev \
          libgles2-mesa-dev \
          libegl1-mesa-dev \
          libdbus-1-dev \
          libibus-1.0-dev \
          libudev-dev \
          libthai-dev \
          libpipewire-0.3-dev \
          libwayland-dev \
          libdecor-0-dev \
          liburing-dev

    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.29'

    - name: Download QhenkiX
      uses: actions/download-artifact@v4
      with:
        name: qhenkix-prebuilt-linux-${{ matrix.config }}
        path: prebuilt-qhenkix/

    - name: Download SXC
      uses: actions/download-artifact@v4
      with:
        name: sxc-linux-${{ matrix.config }}
        path: prebuilt-sxc/

    - name: Configure CMake
      run: cmake --preset ${{ matrix.config == 'Debug' && 'linux-prebuilt-examples-debug' || 'linux-prebuilt-examples-release' }}

    - name: Build ${{ matrix.example }} (${{ matrix.config }})
      run: cmake --build build --target ${{ matrix.example }} --parallel

    - name: Upload ${{ matrix.example }} (${{ matrix.config }}) Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.example }}-build-linux-${{ matrix.config }}
        path: build/Examples/${{ matrix.example }}/
        retention-days: 1
        if-no-files-found: error

  linux-build-gate:
    name: Linux build
    runs-on: ubuntu-24.04
    needs:
      - build-qhenkix
      - build-sxc
      - build-examples
    if: ${{ always() }}
    steps:
      - name: Fail if any upstream job failed
        run: |
          for result in "${{ needs.build-qhenkix.result }}" "${{ needs.build-sxc.result }}" "${{ needs.build-examples.result }}"; do
            if [ "$result" != "success" ]; then
              echo "Upstream job failed: $result"
              exit 1
            fi
          done
          echo "All Linux build jobs succeeded."
