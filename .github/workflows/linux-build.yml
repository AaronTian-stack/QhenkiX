name: "Linux Build (clang-21)"

on:
  workflow_call:
  workflow_dispatch:

env:
  SXC_REF: 655a811453753953a28aefa77f23cec572eafe42

jobs:
  build-sxc:
    name: SXC dependency
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout SXC
      uses: actions/checkout@v4
      with:
        repository: AaronTian-stack/SXC
        ref: ${{ env.SXC_REF }}
        path: sxc-source
        submodules: recursive

    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '4.2'

    - name: Install Ninja
      run: sudo apt-get update && sudo apt-get install -y ninja-build

    - name: Configure SXC
      run: cmake --preset linux-release -S sxc-source

    - name: Build SXC
      run: cmake --build sxc-source/build --config Release --target SXC --parallel

    - name: Package SXC for this workflow
      run: cmake --install sxc-source/build --config Release --prefix prebuilt-sxc

    - name: Upload SXC dependency
      uses: actions/upload-artifact@v4
      with:
        name: sxc-sdk-linux
        path: prebuilt-sxc/
        retention-days: 1
        if-no-files-found: error

  build-qhenkix:
    name: QhenkiX
    runs-on: ubuntu-24.04
    needs: build-sxc
    strategy:
      matrix:
        config: [Debug, Release]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        fetch-depth: 0

    - name: Set up Linux build environment
      uses: ./.github/actions/linux-build-env

    - name: Download SXC dependency
      uses: actions/download-artifact@v4
      with:
        name: sxc-sdk-linux
        path: prebuilt-sxc/

    - name: Configure CMake
      run: >-
        cmake --preset ${{ matrix.config == 'Debug' && 'linux-debug' || 'linux-release' }}
        -DBUILD_GLTF_VIEWER=OFF
        -DBUILD_IMGUI_EXAMPLE=OFF
        -DBUILD_SIMPLE_EXAMPLE=OFF
        -DBUILD_RETRO_EXAMPLE=OFF
        -DSXC_ROOT=${{ github.workspace }}/prebuilt-sxc

    - name: Build QhenkiX
      run: cmake --build build --target QhenkiX --parallel

    - name: Upload QhenkiX Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: qhenkix-prebuilt-linux-${{ matrix.config }}
        path: |
          build/QhenkiX/libQhenkiX.a
          build/SDL/libSDL3.so*
        retention-days: 1
        if-no-files-found: error

  build-examples:
    name: ${{ matrix.example }} (${{ matrix.config }})
    runs-on: ubuntu-24.04
    needs: build-qhenkix
    strategy:
      matrix:
        example: [SimpleExample, ImGuiExample, gltfViewer, RetroExample]
        config: [Debug, Release]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        fetch-depth: 0

    - name: Set up Linux build environment
      uses: ./.github/actions/linux-build-env

    - name: Download QhenkiX
      uses: actions/download-artifact@v4
      with:
        name: qhenkix-prebuilt-linux-${{ matrix.config }}
        path: prebuilt-qhenkix/

    - name: Download SXC dependency
      uses: actions/download-artifact@v4
      with:
        name: sxc-sdk-linux
        path: prebuilt-sxc/

    - name: Mark prebuilt SXC as executable
      run: chmod +x prebuilt-sxc/bin/SXC

    - name: Configure CMake
      run: cmake --preset ${{ matrix.config == 'Debug' && 'linux-prebuilt-examples-debug' || 'linux-prebuilt-examples-release' }}

    - name: Build ${{ matrix.example }} (${{ matrix.config }})
      run: cmake --build build --target ${{ matrix.example }} --parallel

    - name: Upload ${{ matrix.example }} (${{ matrix.config }}) Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.example }}-build-linux-${{ matrix.config }}
        path: build/Examples/${{ matrix.example }}/
        retention-days: 1
        if-no-files-found: error

  linux-build-gate:
    name: Linux build
    runs-on: ubuntu-24.04
    needs:
      - build-qhenkix
      - build-examples
    if: ${{ always() }}
    steps:
      - name: Fail if any upstream job failed
        run: |
          for result in "${{ needs.build-qhenkix.result }}" "${{ needs.build-examples.result }}"; do
            if [ "$result" != "success" ]; then
              echo "Upstream job failed: $result"
              exit 1
            fi
          done
          echo "All Linux build jobs succeeded."
